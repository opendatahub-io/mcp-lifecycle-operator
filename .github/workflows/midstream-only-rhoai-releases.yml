name: Provision RHOAI release branches

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provision-rhoai-branches
  cancel-in-progress: false

jobs:
  provision:
    if: github.repository == 'opendatahub-io/mcp-lifecycle-operator' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ODH main
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 1

      - name: Create missing release branches
        env:
          ODH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/midstream-only-rhoai-releases.py
